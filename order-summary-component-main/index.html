<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="index.css">

  <title>Frontend Mentor | Order summary card</title>
</head>

<body>
  <div class="banner-box">
    <img class="illustration-hero" src="images/illustration-hero.svg" />
    <div class="text">
      <p class="title">Order Summary</p>
      <p>You can now listen to millions of songs, audiobooks, and podcasts on
        any device anywhere you like!
      </p>
    </div>
    <div class="plan-option">
      <img src="images/icon-music.svg" />
      <div class="plan-detail">
        <p><span>Annual Plan</span><br>
          $59.99/year</p>
        <a class="change" href=""> Change</a>
      </div>
    </div>
    <div class="payment-option">
      <button class="payment-button">Proceed to Payment</button><br>
      <button class="cancel-order-button">Cancel Order</button>
    </div>

  </div>
</body>

</html>
